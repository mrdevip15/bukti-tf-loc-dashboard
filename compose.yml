services:
  dashboard:
    build: .
    container_name: bukti-tf-loc-dashboard
    restart: unless-stopped
    init: true
    env_file: .env
    volumes:
      - dashboard_data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    networks:
      - reverse_proxy

networks:
  reverse_proxy:
    external: true
    name: n8n-stack_default

volumes:
  dashboard_data:
    name: bukti-dashboard-data
